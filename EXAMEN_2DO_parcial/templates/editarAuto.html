<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Auto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">
    <div class="card">
      <div class="card-header">
        Editar Auto
      </div>
      <div class="card-body">
        <form action="/actualizar/{{ auto.id }}" method="POST">
          <div class="mb-3">
            <label class="form-label">Marca:</label>
            <input type="text" name="txtMarca" value="{{ auto.marca }}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Modelo:</label>
            <input type="text" name="txtModelo" value="{{ auto.modelo }}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Color:</label>
            <input type="text" name="txtColor" value="{{ auto.color }}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Año:</label>
            <input type="number" name="txtAnio" value="{{ auto.anio }}" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary">Actualizar</button>
          <a href="/" class="btn btn-secondary">Regresar</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
